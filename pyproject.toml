[project]
name = "sportspipeline"
version = "0.1.0"
description = "Sports data ontology, graded signals and a guarded action layer on Postgres (Supabase)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sportspipeline = "sportspipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportspipeline"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "sportspipeline/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
